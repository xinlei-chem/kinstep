[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kinstep"
version = "0.1.0.dev0"
description = "Microkinetic modelling across modalities: Sono / Thermal / Electro / Photo"
readme = "README.md"
requires-python = ">=3.9"
# ★ 以前钉在 3.11，只因为 `tomllib` 是 3.11 才进标准库 —— 为了一个读配置的函数
#   把门槛抬到 3.11，对还在 3.9/3.10 的机群是实打实的障碍。改为按版本回退到 tomli。
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Yile Yang" }]
keywords = ["microkinetics", "catalysis", "electrocatalysis", "photocatalysis",
            "degree of rate control", "volcano plot"]

# ★ 核心依赖只有两个（立项目标：纯 Python，不要 MATLAB）
dependencies = ["numpy>=1.24", "scipy>=1.10", "tomli>=1.1.0; python_version < '3.11'"]

[project.optional-dependencies]
# 高精度：1−z 压到 double 最后一位时自动启用（见 kinstep/hp.py）
highprec = ["mpmath>=1.3"]
# 作图：没有它也能跑，只是不出图（数据照常导出）
plot = ["matplotlib>=3.6"]
all = ["mpmath>=1.3", "matplotlib>=3.6"]

[project.scripts]
kinstep = "kinstep.cli:main"

[tool.setuptools]
packages = ["kinstep", "kinstep.drivers"]
